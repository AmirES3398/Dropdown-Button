<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drop-Down Button</title>
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="drop-down-btn-wrapper">
      <button type="submit" class="drop-down-btn">
        User Profile
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="button-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m19.5 8.25-7.5 7.5-7.5-7.5"
          />
        </svg>
      </button>
      <div class="drop-down-wrapper">
        <a class="drop-down-part" href="#">Basket</a>
        <a class="drop-down-part" href="#">Courses</a>
        <a class="drop-down-part" href="#">Account</a>
        <a class="drop-down-part" href="#">Logout</a>
      </div>
    </div>
  </body>
</html>
